#   instance:
#     preferIpAddress: true
#     instanceId: ${spring.application.name}:${random.uuid}

# Logging Configuration
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

