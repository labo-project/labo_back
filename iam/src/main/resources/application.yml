spring:
  application:
    name: iam # Change this for each service
  datasource:
    url: jdbc:postgresql://${DB_HOSTNAME:localhost}:5432/${DB_NAME:labexams}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admingres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:your-secret-key-at-least-256-bits-long-for-HS256}
  expiration: 36000 # 1 hour in seconds

server:
  port: 8090 # Different port for each service

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
