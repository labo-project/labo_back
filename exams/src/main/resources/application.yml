# src/main/resources/application.yml
spring:
  application:
    name: exams  # Change this for each service
  datasource:
    url: jdbc:postgresql://localhost:5432/labexams
    username: postgres
    password: admingres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080  # Different port for each service

# Eureka Client Configuration
