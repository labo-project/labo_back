# src/main/resources/application.yml
spring:
  application:
    name: exams  # Change this for each service
  datasource:
    url: jdbc:postgresql://${DB_HOSTNAME:localhost}:5432/${DB_NAME:labexams}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admingres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081  # Different port for each service

# Eureka Client Configuration
# eureka:
#   client:
#     serviceUrl:
#       defaultZone: http://localhost:8761/eureka/
#   instance:
#     preferIpAddress: true
#     instanceId: ${spring.application.name}:${random.uuid}

# Logging Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-at-least-256-bits-long-for-HS256}
  expiration: 3600 # 1 hour in seconds
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

